title: CSCI 131 — Introduction to Python Programming
description: Lecture notes, Fall 2026
baseurl: "/csci131"
theme: minima
markdown: kramdown
# Lectures/labs dated after "now" are excluded from the build entirely
# (no page written, so a guessed URL 404s). Preview them locally with
# `bundle exec jekyll serve --future`, which overrides this for that run only.
future: false
collections:
  lectures:
    output: true
    permalink: /lectures/:name/
defaults:
  - scope:
      path: ""
      type: lectures
    values:
      layout: page
  # Any index.md inside a labs/ subdirectory becomes a lab page automatically.
  # `order` controls the position in the Labs index; override it per lab.
  - scope:
      path: "labs"
    values:
      layout: lab
      order: 0
header_pages:
  - lectures.md
  - labs.md
  - code.md
